<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收現 ／ 數位收款 自評收據</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg:#DBD6C4;
    --paper:#FBF9F1;
    --paper-line:#D9D3BE;
    --ink:#23262B;
    --ink-soft:#63676C;
    --ink-faint:#95988F;
    --stamp:#B23A2E;
    --stamp-dark:#7C271F;
    --digital:#2F6E4F;
    --mid:#A8791F;
    --radius:10px;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    padding:48px 16px 80px;
    background:var(--page-bg);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
    color:var(--ink);
    font-family:'Noto Sans TC', system-ui, sans-serif;
    display:flex;
    justify-content:center;
  }

  .mono{ font-family:'DotGothic16','Noto Sans TC',monospace; letter-spacing:0.03em; }

  .receipt{
    position:relative;
    width:100%;
    max-width:560px;
    background:var(--paper);
    padding:38px 30px 34px;
    box-shadow:0 18px 40px -12px rgba(35,38,43,0.35), 0 2px 0 rgba(35,38,43,0.06);
  }
  .receipt::before, .receipt::after{
    content:"";
    position:absolute; left:0; right:0; height:14px;
    background:
      linear-gradient(-45deg, var(--paper) 8px, transparent 0),
      linear-gradient(45deg, var(--paper) 8px, transparent 0);
    background-size:16px 16px;
    background-repeat:repeat-x;
    background-color:transparent;
  }
  .receipt::before{ top:-14px; }
  .receipt::after{ bottom:-14px; transform:rotate(180deg); }

  header.top{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding-bottom:16px; margin-bottom:18px;
    border-bottom:2px dashed var(--paper-line);
  }
  header.top .brand{ line-height:1.2; }
  header.top h1{
    margin:0 0 4px; font-size:20px; font-weight:900; letter-spacing:0.04em;
  }
  header.top .sub{ font-size:12.5px; color:var(--ink-soft); }
  header.top .meta{
    text-align:right; font-size:11px; color:var(--ink-faint);
  }
  header.top .meta div{ margin-bottom:2px; }

  .intro{
    font-size:13px; color:var(--ink-soft); line-height:1.7; margin:0 0 22px;
  }

  ol.items{ list-style:none; margin:0; padding:0; }

  .item{
    padding:16px 0; border-bottom:1px dashed var(--paper-line);
  }
  .item:first-child{ padding-top:0; }

  .item .qhead{
    display:flex; gap:10px; margin-bottom:12px;
  }
  .item .qnum{
    font-size:12px; color:var(--ink-faint); padding-top:2px; flex-shrink:0; min-width:20px;
  }
  .item .qtext{
    font-size:14.5px; font-weight:500; line-height:1.55;
  }

  .opts{
    display:flex; flex-direction:column; gap:8px;
    padding-left:30px;
  }

  button.opt{
    all:unset;
    cursor:pointer;
    display:flex; align-items:center; gap:10px;
    font-family:inherit; font-size:13.5px; color:var(--ink);
    padding:9px 12px;
    border:1px solid var(--paper-line);
    border-radius:7px;
    background:#fff;
    transition:border-color .15s ease, background .15s ease;
  }
  button.opt:hover{ border-color:var(--ink-faint); }
  button.opt:focus-visible{ outline:2px solid var(--stamp); outline-offset:2px; }

  button.opt .tick{
    width:15px; height:15px; border-radius:3px;
    border:1.5px solid var(--ink-faint);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; color:transparent;
  }
  button.opt.sel{
    border-color:var(--ink); background:#F4F1E6;
  }
  button.opt.sel .tick{
    background:var(--ink); border-color:var(--ink); color:var(--paper);
  }
  button.opt.sel .tick::after{ content:"✓"; }
  button.opt .pts{
    margin-left:auto; font-size:11px; color:var(--ink-faint);
  }
  button.opt.sel .pts{ color:var(--ink-soft); }

  .subtotal-line{
    display:flex; justify-content:space-between; align-items:center;
    padding-top:20px; margin-top:6px;
    border-top:2px dashed var(--paper-line);
    font-size:14px;
  }
  .subtotal-line .l{ color:var(--ink-soft); }
  .subtotal-line .r{ font-weight:700; font-size:16px; }

  .cta{
    all:unset; cursor:pointer;
    display:block; width:100%;
    text-align:center;
    margin-top:18px;
    padding:13px;
    background:var(--ink); color:var(--paper);
    font-weight:700; font-size:14.5px; letter-spacing:0.04em;
    border-radius:7px;
    transition:opacity .15s ease, transform .1s ease;
  }
  .cta:hover:not(:disabled){ opacity:0.88; }
  .cta:active:not(:disabled){ transform:scale(0.99); }
  .cta:disabled{ background:var(--paper-line); color:var(--ink-faint); cursor:not-allowed; }

  .hint{
    text-align:center; font-size:11.5px; color:var(--ink-faint); margin-top:8px;
  }

  .result{
    display:none;
    margin-top:26px;
    padding-top:22px;
    border-top:2px dashed var(--paper-line);
  }
  .result.show{ display:block; }

  .scale{
    position:relative;
    height:8px; border-radius:4px;
    background:linear-gradient(to right, var(--stamp) 0%, var(--stamp) 35%, var(--mid) 35%, var(--mid) 65%, var(--digital) 65%, var(--digital) 100%);
    margin:10px 0 6px;
  }
  .scale .marker{
    position:absolute; top:-5px;
    width:2px; height:18px; background:var(--ink);
    transform:translateX(-1px);
    transition:left .5s cubic-bezier(.2,.8,.2,1);
  }
  .scale-labels{
    display:flex; justify-content:space-between;
    font-size:10.5px; color:var(--ink-faint);
  }

  .stamp-wrap{
    display:flex; justify-content:center; margin:26px 0 18px;
  }
  .stamp{
    width:230px; min-height:150px; border-radius:14px;
    border:3px solid var(--stamp);
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    color:var(--stamp);
    transform:rotate(-6deg) scale(0.4);
    opacity:0;
    padding:18px 16px;
  }
  .stamp.pop{
    animation: stampIn .38s cubic-bezier(.2,.9,.3,1.2) forwards;
  }
  @keyframes stampIn{
    0%{ transform:rotate(-6deg) scale(1.9); opacity:0; }
    60%{ opacity:1; }
    100%{ transform:rotate(-6deg) scale(1); opacity:1; }
  }
  .stamp::before{
    content:"";
    position:absolute;
  }
  .stamp .stext{
    font-weight:900; font-size:14px; line-height:1.4; letter-spacing:0.02em;
  }
  .stamp .stext .level{
    display:block;
    font-size:27px;
    line-height:1.3;
    margin-top:5px;
    letter-spacing:0.01em;
  }
  .stamp .ssub{
    display:block; font-size:10.5px; font-weight:400; margin-top:9px; letter-spacing:0.08em;
  }

  .verdict-desc{
    font-size:13.5px; line-height:1.8; color:var(--ink); text-align:left;
  }
  .verdict-desc strong{ color:var(--stamp-dark); }

  .note{
    margin-top:16px;
    padding:12px 14px;
    background:#F4F1E6;
    border-left:3px solid var(--mid);
    font-size:12.5px; line-height:1.7; color:var(--ink-soft);
    display:none;
  }
  .note.show{ display:block; }

  footer.legal{
    margin-top:26px; padding-top:16px; border-top:1px dashed var(--paper-line);
    font-size:10.5px; line-height:1.8; color:var(--ink-faint);
  }

  @media (prefers-reduced-motion: reduce){
    .stamp.pop{ animation:none; opacity:1; transform:rotate(-6deg) scale(1); }
    .scale .marker{ transition:none; }
  }

  @media (max-width:480px){
    .receipt{ padding:30px 18px 28px; }
    .opts{ padding-left:0; }
    .stamp{ width:100%; max-width:260px; min-height:130px; }
    .stamp .stext{ font-size:12.5px; }
    .stamp .stext .level{ font-size:22px; }
  }
</style>
</head>
<body>

<div class="receipt">
  <header class="top">
    <div class="brand">
      <h1>商家數位收款適用性評估</h1>
    </div>
  </header>

  <p class="intro">請依實際營運狀況勾選，本評估僅供營運規劃參考。</p>

  <ol class="items" id="items"></ol>

  <div class="subtotal-line">
    <span class="l">合計</span>
    <span class="r mono" id="finalTotal">0 / 10</span>
  </div>

  <button class="cta" id="stampBtn" disabled>請先完成全部 5 題</button>

  <div class="result" id="result">
    <div class="scale">
      <div class="marker" id="marker" style="left:0%"></div>
    </div>
    <div class="scale-labels">
      <span>低</span>
      <span>中</span>
      <span>高</span>
    </div>

    <div class="stamp-wrap">
      <div class="stamp" id="stamp">
        <div>
          <div class="stext" id="stampText">—</div>
          <span class="ssub mono" id="stampScore">0 / 10</span>
        </div>
      </div>
    </div>

    <div class="note" id="taxNote">
      📌 營業額接近20萬門檻也不用擔心，申請「行動支付租稅優惠」即可維持1%稅率、免開發票（適用至2028年底）。
    </div>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    text: "店裡平均每月營業總額大約多少？",
    opts: ["未達10萬", "10萬至18萬", "18萬以上"]
  },
  {
    text: "店裡平均每天經手的現金總金額，大約多少？",
    opts: ["5,000元以下", "5,000～20,000元", "20,000元以上"]
  },
  {
    text: "過去一個月，店裡因零錢不足導致交易延誤、中斷，或必須暫停營業去換零錢的次數？",
    opts: ["0次", "1～2次", "3次以上"]
  },
  {
    text: "過去一個月，店裡非熟客／第一次上門的客人，佔當月來客數的比例？",
    opts: ["低於10%", "10%～30%", "30%以上"]
  },
  {
    text: "觀察周邊或同業，目前使用數位收款的比例有多少？",
    opts: ["少數或幾乎沒有同業使用", "約一半同業已使用", "大多數同業已使用"]
  }
];

const state = new Array(QUESTIONS.length).fill(null);

const itemsEl = document.getElementById('items');
QUESTIONS.forEach((q, qi) => {
  const li = document.createElement('li');
  li.className = 'item';
  const head = document.createElement('div');
  head.className = 'qhead';
  head.innerHTML = `<span class="qnum mono">${String(qi+1).padStart(2,'0')}</span><span class="qtext">${q.text}</span>`;
  li.appendChild(head);

  const opts = document.createElement('div');
  opts.className = 'opts';
  q.opts.forEach((label, oi) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.type = 'button';
    btn.innerHTML = `<span class="tick"></span><span>${label}</span><span class="pts mono">${oi}分</span>`;
    btn.addEventListener('click', () => {
      state[qi] = oi;
      [...opts.children].forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
      updateTotals();
    });
    opts.appendChild(btn);
  });
  li.appendChild(opts);
  itemsEl.appendChild(li);
});

const finalTotalEl = document.getElementById('finalTotal');
const stampBtn = document.getElementById('stampBtn');

function updateTotals(){
  const answered = state.filter(v => v !== null).length;
  const total = state.reduce((s, v) => s + (v ?? 0), 0);
  finalTotalEl.textContent = `${total} / 10`;

  if(answered === QUESTIONS.length){
    stampBtn.disabled = false;
    stampBtn.textContent = '查看建議';
  } else {
    stampBtn.disabled = true;
    stampBtn.textContent = `請先完成全部 5 題（已完成 ${answered}／5）`;
  }
}

const resultEl = document.getElementById('result');
const markerEl = document.getElementById('marker');
const stampEl = document.getElementById('stamp');
const stampTextEl = document.getElementById('stampText');
const stampScoreEl = document.getElementById('stampScore');
const taxNoteEl = document.getElementById('taxNote');

stampBtn.addEventListener('click', () => {
  const total = state.reduce((s, v) => s + v, 0);

  let title;
  if(total <= 3){
    title = '可維持<br><span class="level">現金收款</span>';
  } else if(total <= 6){
    title = '建議可增加<br><span class="level">一種數位收款</span>';
  } else {
    title = '建議導入數位收款<br><span class="level">提升管理效率</span>';
  }

  stampTextEl.innerHTML = title;
  stampScoreEl.textContent = `${total} / 10`;

  markerEl.style.left = `${(total/10*100).toFixed(1)}%`;

  taxNoteEl.classList.toggle('show', state[0] >= 1);

  resultEl.classList.add('show');
  stampEl.classList.remove('pop');
  void stampEl.offsetWidth;
  stampEl.classList.add('pop');

  resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});
</script>

</body>
</html>
